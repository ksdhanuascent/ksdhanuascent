name: Update Neural Profile Telemetry

on:
  schedule:
    # Run every 15 minutes
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - update_neural_profile.py
      - .github/workflows/update-neural-profile.yml
  repository_dispatch:
    types:
      - commit-pushed

permissions:
  contents: write

jobs:
  telemetry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate Profile Telemetry SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python update_neural_profile.py

      - name: Commit & Push Dynamic Telemetry
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add system-telemetry.svg banner.svg neural-heatmap.svg tech-loop.svg
          if git diff --staged --quiet; then
            echo "No telemetry changes detected."
          else
            git commit -m "chore(telemetry): auto-update profile SVGs [skip ci]"
            git push
          fi
