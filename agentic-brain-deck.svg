  <text x="618" y="25" class="mono" font-size="10" fill="#64748b">//</text>
  <text x="632" y="25" class="mono" font-size="9.5" fill="#94a3b8">arch-spec</text>
  <text x="878" y="25" class="mono" font-size="8.5" fill="#64748b" text-anchor="end">CONF: AGENTIC_PROD</text>

