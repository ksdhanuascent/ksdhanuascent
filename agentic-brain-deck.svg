<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330">
  <defs>
    <linearGradient id="deckBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1623" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="goldCorePulse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd15c" />
      <stop offset="100%" stop-color="#dfa620" />
    </linearGradient>
    <linearGradient id="synapseCyanGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#ffd15c" />
    </linearGradient>
    <filter id="coreGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      .mono { font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', Consolas, 'Liberation Mono', monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      @keyframes coreRingPulse {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.18); opacity: 0.25; }
      }
      .pulse-ring-1 { transform-origin: 225px 158px; animation: coreRingPulse 3.2s ease-in-out infinite; }
      .pulse-ring-2 { transform-origin: 225px 158px; animation: coreRingPulse 3.2s ease-in-out infinite 1.6s; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="900" height="330" fill="#090d16" />

  <!-- ======================================================== -->
  <!-- LEFT PANEL: Agentic AI Brain & Multi-Agent Topology Visual -->
  <!-- Coordinates: x=8..442, y=8..322 (width=434, height=314)     -->
  <!-- ======================================================== -->
  <rect x="8" y="8" width="434" height="314" rx="6" fill="url(#deckBgGrad)" stroke="#1e293b" stroke-width="1" />

  <!-- Golden Corner Bracket Accents -->
  <path d="M 12 22 L 12 12 L 22 12" stroke="#d49b1a" stroke-width="1.5" fill="none" />
  <path d="M 430 12 L 440 12 L 440 22" stroke="#d49b1a" stroke-width="1.5" fill="none" />
  <path d="M 12 308 L 12 318 L 22 318" stroke="#d49b1a" stroke-width="1.5" fill="none" />
  <path d="M 430 318 L 440 318 L 440 308" stroke="#d49b1a" stroke-width="1.5" fill="none" />

  <!-- Left HUD Top Bar -->
  <line x1="8" y1="38" x2="442" y2="38" stroke="#1e293b" stroke-width="1" />
  <text x="20" y="25" class="mono" font-size="10.5" font-weight="700" fill="#ffd15c">AGENTIC_BRAIN_TOPOLOGY</text>
  <text x="195" y="25" class="mono" font-size="10" fill="#64748b">//</text>
  <text x="210" y="25" class="mono" font-size="9.5" fill="#94a3b8">neural-core.svg</text>
  <text x="424" y="25" class="mono" font-size="8.5" fill="#ffd15c" text-anchor="end">6-NODE ACTIVE</text>

