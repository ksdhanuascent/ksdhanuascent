  <text x="474" y="64" class="sans" font-size="19" font-weight="800" fill="#ffffff" letter-spacing="-0.3">Dhanudharan K.S</text>
  <text x="474" y="81" class="mono" font-size="11" font-weight="600" fill="#ffd15c">Agentic AI Engineer &amp; System Architect</text>

