    <rect x="-32" y="10" width="64" height="14" rx="3" fill="#090d16" stroke="#1e293b" stroke-width="0.8" />
    <text x="0" y="20" class="mono" font-size="8" font-weight="700" fill="#ffd15c" text-anchor="middle">TOOL USE</text>
