  <!-- Memory to Execution -->
  <line x1="95" y1="185" x2="225" y2="238" stroke="#1e293b" stroke-width="1" />
  <!-- Tool Use to Execution -->
  <line x1="355" y1="185" x2="225" y2="238" stroke="#1e293b" stroke-width="1" />
  <!-- Perception to Core -->
  <line x1="115" y1="105" x2="225" y2="158" stroke="#1e293b" stroke-width="1" stroke-dasharray="2,3" />
  <!-- Reasoning to Core -->
  <line x1="335" y1="105" x2="225" y2="158" stroke="#1e293b" stroke-width="1" stroke-dasharray="2,3" />

  <!-- Secondary Synaptic Micro-Nodes for Intricate Density -->
  <circle cx="165" cy="122" r="2.5" fill="#1e293b" />
  <circle cx="285" cy="122" r="2.5" fill="#1e293b" />
  <circle cx="150" cy="210" r="2.5" fill="#1e293b" />
  <circle cx="300" cy="210" r="2.5" fill="#1e293b" />
  <circle cx="185" cy="168" r="2" fill="#d49b1a" />
  <circle cx="265" cy="168" r="2" fill="#d49b1a" />

