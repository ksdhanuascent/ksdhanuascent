  <circle cx="225" cy="158" r="26" fill="none" stroke="#ffd15c" stroke-width="1" opacity="0.3" class="pulse-ring-1" />
  <circle cx="225" cy="158" r="38" fill="none" stroke="#d49b1a" stroke-width="0.8" opacity="0.2" class="pulse-ring-2" />
  <circle cx="225" cy="158" r="16" fill="#ffd15c" fill-opacity="0.12" stroke="#ffd15c" stroke-width="1.5" />
  <circle cx="225" cy="158" r="7" fill="#ffd15c" filter="url(#coreGlow)" />

