      <text x="8" y="14" class="mono" font-size="9.5" font-weight="700" fill="#ffd15c">Design Pattern</text>
      <text x="110" y="14" class="mono" font-size="9.5" fill="#64748b">:</text>
      <text x="122" y="14" class="mono" font-size="9.5" font-weight="500" fill="#f1f5f9">Deterministic • Zero-Waste • HITL Gates</text>
