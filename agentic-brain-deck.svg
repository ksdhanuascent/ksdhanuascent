  <circle cx="474" cy="225" r="2" fill="#d49b1a" />
  <circle cx="876" cy="225" r="2" fill="#d49b1a" />

  <!-- Italicized Architectural Statement -->
  <g transform="translate(474, 242)">
    <text x="0" y="0" class="sans" font-size="10.2" font-style="italic" fill="#94a3b8">
